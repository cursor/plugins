name: Validate plugins

on:
  pull_request:
    paths:
      - ".cursor-plugin/marketplace.json"
      - "**/plugin.json"
      - "schemas/**"
      - "pstack/**"
      - "package.json"
      - "bun.lock"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate plugin definitions
        run: node scripts/validate-plugins.mjs

      - name: Check pstack portability contract
        run: node scripts/check-pstack-portability.mjs

      - name: Check pstack skill references
        run: node scripts/check-pstack-references.mjs
