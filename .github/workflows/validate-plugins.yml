name: Validate plugins

on:
  pull_request:
    paths:
      - ".cursor-plugin/marketplace.json"
      - ".claude-plugin/marketplace.json"
      - "**/plugin.json"
      - "schemas/**"
      - "scripts/validate-plugins.mjs"
      - ".github/workflows/validate-plugins.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-save ajv ajv-formats

      - name: Validate plugin definitions
        run: node scripts/validate-plugins.mjs

      - name: Validate Claude Code plugin definitions
        run: npx --yes @anthropic-ai/claude-code@2.1.299 plugin validate .
