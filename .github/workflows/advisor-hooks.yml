name: Test Advisor hooks

on:
  pull_request:
    paths:
      - "advisor/hooks/**"
      - ".github/workflows/advisor-hooks.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Test consult persistence
        run: node --test advisor/hooks/record-consult.test.mjs
