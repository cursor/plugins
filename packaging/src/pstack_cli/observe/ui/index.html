<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>pstack — Session workspace</title>
<link rel="icon" href="data:,">
<style>
:root{
  --bg:#f5f5f2;--panel:#ffffff;--panel2:#fafaf8;--line:#e2e2dc;--line2:#d0d0c8;
  --text:#1c1c1a;--muted:#6a6a64;--faint:#9a9a92;
  --accent:#2d6cdf;--accent-bg:#e8f0fd;
  --ok:#1d8348;--ok-bg:#e5f4ea;--warn:#b86e00;--warn-bg:#fdf1dc;--err:#c0392b;--err-bg:#fbe7e4;
  --violet:#7b4bc4;--violet-bg:#f0e9fb;
  --working:#2d6cdf;--stalled:#d48806;--waiting:#5b6b82;--idle:#a3a39b;
  --h-claude:#c4643b;--h-codex:#0f8a6c;--h-copilot:#6f42c1;--h-vscode:#0a66b8;
  --sel:#e9eefb;--hover:#f0f0ec;--code:#f1f1ed;
  --shadow:0 1px 2px rgba(0,0,0,.05);
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,Ubuntu,"Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#141413;--panel:#1c1c1b;--panel2:#20201f;--line:#2e2e2c;--line2:#3a3a37;
    --text:#e8e8e3;--muted:#a3a39b;--faint:#6f6f68;
    --accent:#6b9cf5;--accent-bg:#1e2a42;
    --ok:#4cc27d;--ok-bg:#16301f;--warn:#f0a73a;--warn-bg:#352813;--err:#f06f5f;--err-bg:#3a1a16;
    --violet:#b393f0;--violet-bg:#2a2140;
    --working:#6b9cf5;--stalled:#f0a73a;--waiting:#8d9bb0;--idle:#6f6f68;
    --h-claude:#e08a62;--h-codex:#3cc09c;--h-copilot:#a585e6;--h-vscode:#4aa3ea;
    --sel:#24304a;--hover:#252523;--code:#262624;
    --shadow:none;
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:13px/1.45 var(--sans);overflow:hidden}
button{font:inherit;color:inherit}
code,.mono{font-family:var(--mono);font-size:12px}
#app{display:grid;grid-template-rows:auto 1fr;grid-template-columns:320px 1fr;height:100vh}
#top{grid-column:1/3;display:flex;align-items:center;gap:14px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
#top .brand{font-weight:650;letter-spacing:.01em}
#top .brand span{color:var(--muted);font-weight:400}
#top .spacer{flex:1}
#conn{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
#conn .dot{width:8px;height:8px;border-radius:50%;background:var(--idle)}
#conn.live .dot{background:var(--ok);box-shadow:0 0 0 3px var(--ok-bg)}
#conn.connecting .dot,#conn.reconnecting .dot{background:var(--warn);animation:blink 1s infinite}
#conn.offline .dot{background:var(--err)}
#totals{font-size:12px;color:var(--muted)}

/* sidebar */
#side{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line);background:var(--panel)}
#filters{padding:10px;display:flex;flex-direction:column;gap:7px;border-bottom:1px solid var(--line)}
#q{width:100%;padding:6px 9px;border:1px solid var(--line2);border-radius:6px;background:var(--panel2);color:var(--text);font:inherit}
#q:focus{outline:2px solid var(--accent);outline-offset:-1px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{border:1px solid var(--line2);background:transparent;border-radius:999px;padding:1px 8px;font-size:11.5px;cursor:pointer;color:var(--muted)}
.chip:hover{background:var(--hover)}
.chip.on{background:var(--accent-bg);border-color:var(--accent);color:var(--accent)}
#list{flex:1;overflow-y:auto;min-height:0;outline:none}
#list .none{padding:18px;color:var(--muted)}
.srow{padding:8px 10px 8px 12px;border-bottom:1px solid var(--line);cursor:pointer;position:relative}
.srow:hover{background:var(--hover)}
.srow.sel{background:var(--sel)}
.srow.sel::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.srow .l1{display:flex;align-items:center;gap:6px;min-width:0}
.srow .ttl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:550}
.srow .ttl.prompt{font-weight:400;font-style:italic}
.srow .upd{font-size:11px;color:var(--faint);white-space:nowrap}
.srow .l2,.srow .l3{display:flex;gap:8px;font-size:11.5px;color:var(--muted);margin-top:2px;min-width:0;align-items:center}
.srow .l2 span,.srow .l3 span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.srow .l3{color:var(--text)}
.host{font-size:10.5px;font-weight:650;padding:0 5px;border-radius:4px;color:#fff;white-space:nowrap;line-height:17px;flex:none}
.host.claude{background:var(--h-claude)}.host.codex{background:var(--h-codex)}.host.copilot{background:var(--h-copilot)}.host.vscode-copilot{background:var(--h-vscode)}
.host.other{background:var(--muted)}
.state{display:inline-flex;align-items:center;gap:4px;font-size:11px;white-space:nowrap;flex:none}
.sdot{width:8px;height:8px;border-radius:50%;background:var(--idle);flex:none}
.state.working .sdot,.sdot.working{background:var(--working);animation:pulse 1.2s ease-in-out infinite}
.state.stalled .sdot,.sdot.stalled{background:var(--stalled)}
.state.stalled{color:var(--stalled);font-weight:600}
.state.waiting .sdot,.sdot.waiting{background:var(--waiting)}
.state.idle .sdot,.sdot.idle{background:var(--idle)}
.sdot.done{background:var(--ok)}.sdot.failed{background:var(--err)}
.state.working{color:var(--working)}
.runtag{font-size:11px;padding:0 6px;border-radius:4px;background:var(--violet-bg);color:var(--violet);white-space:nowrap}
.runtag.complete{background:var(--ok-bg);color:var(--ok)}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
@keyframes blink{50%{opacity:.3}}

/* main */
#main{min-width:0;min-height:0;display:flex;flex-direction:column}
#empty{margin:auto;color:var(--muted);text-align:center;padding:30px}
#detail{display:flex;flex-direction:column;min-height:0;flex:1}
#shead{padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;gap:3px}
#shead .t1{display:flex;align-items:center;gap:8px;min-width:0}
#shead h1{font-size:15px;margin:0;font-weight:620;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
#shead .meta{display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--muted);font-size:12px}
#shead .meta b{font-weight:500;color:var(--text)}
#grid{flex:1;min-height:0;display:grid;grid-template-columns:minmax(330px,40%) 1fr;gap:10px;padding:10px}
@media(min-width:1250px){#grid.workflow{grid-template-columns:minmax(330px,62%) minmax(0,1fr)}}
.col{display:flex;flex-direction:column;gap:10px;min-height:0;min-width:0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:0}
.panel>header{display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid var(--line);font-weight:600;font-size:12.5px}
.panel>header .sub{color:var(--muted);font-weight:400;font-size:12px}
.panel>header .spacer{flex:1}
.pbody{padding:10px;overflow:auto;min-height:0}
#p-graph{flex:1 1 55%}
#p-run{flex:1 1 45%}
#p-agents{flex:0 0 auto;max-height:40%}
#p-tl{flex:1 1 auto}
.empty{color:var(--muted);padding:6px 0}
.notice{padding:9px 11px;border-radius:6px;background:var(--panel2);border:1px dashed var(--line2);color:var(--muted)}
.notice b{color:var(--text)}
.err-box{padding:9px 11px;border-radius:6px;background:var(--err-bg);color:var(--err)}

/* graph */
#runtabs{display:flex;gap:4px}
#graph-wrap{overflow:auto}
#graph svg{display:block}
#graph .node{cursor:pointer}
#graph .node rect.box{fill:var(--panel);stroke:var(--line2);stroke-width:1.2}
#graph .node:hover rect.box{stroke:var(--accent)}
#graph .node:focus{outline:none}
#graph .node:focus rect.box,#graph .node.sel rect.box{stroke:var(--accent);stroke-width:2.2}
#graph .node text{fill:var(--text);font:12.5px var(--sans);pointer-events:none}
#graph .node text.st{fill:var(--muted);font-size:10.5px}
#graph .node circle.num{fill:var(--panel2);stroke:var(--line2)}
#graph .node text.numt{font-size:10.5px;fill:var(--muted);font-weight:600}
#graph .n-done rect.box{fill:var(--ok-bg);stroke:var(--ok)}
#graph .n-done circle.num{fill:var(--ok);stroke:var(--ok)}#graph .n-done text.numt{fill:#fff}
#graph .n-done text.st{fill:var(--ok)}
#graph .n-revisited rect.box{fill:var(--violet-bg);stroke:var(--violet)}
#graph .n-revisited circle.num{fill:var(--violet);stroke:var(--violet)}#graph .n-revisited text.numt{fill:#fff}
#graph .n-revisited text.st{fill:var(--violet);font-weight:600}
#graph .n-skipped rect.box{fill:url(#hatch);stroke:var(--line2);stroke-dasharray:4 3}
#graph .n-skipped text.lbl{fill:var(--muted);text-decoration:line-through}
#graph .n-active rect.box{fill:var(--accent-bg);stroke:var(--accent);stroke-width:2;animation:glow 1.4s ease-in-out infinite}
#graph .n-active circle.num{fill:var(--accent);stroke:var(--accent)}#graph .n-active text.numt{fill:#fff}
#graph .n-active text.st{fill:var(--accent);font-weight:600}
#graph .n-failed rect.box{fill:var(--err-bg);stroke:var(--err)}
#graph .n-blocked rect.box,#graph .n-paused rect.box{fill:var(--warn-bg);stroke:var(--warn)}
#graph .workflow-group{fill:var(--panel2);stroke:var(--line);stroke-dasharray:4 4}
#graph .workflow-graph .e:not(.taken){stroke-dasharray:4 4}
#graph .n-pending text.lbl{fill:var(--muted)}
#graph .cur-ring{fill:none;stroke:var(--accent);stroke-width:1.2;stroke-dasharray:2 3}
@keyframes glow{0%,100%{stroke-opacity:1}50%{stroke-opacity:.25}}
#graph .hatch-bg{fill:var(--panel2)}#graph .hatch-ln{stroke:var(--line2);stroke-width:1.5}
#graph .e{fill:none;stroke:var(--line2);stroke-width:1.4}
#graph .e.next.taken{stroke:var(--accent);stroke-width:2.4}
#graph .e.back{stroke:var(--faint);stroke-dasharray:5 4}
#graph .e.back.taken{stroke:var(--violet);stroke-width:2.4;stroke-dasharray:none}
#graph .e.fwd{stroke:var(--faint);stroke-dasharray:3 3}
#graph .e.fwd.taken{stroke:var(--accent);stroke-width:2;stroke-dasharray:none}
#graph .e.synth.back.taken{stroke:var(--warn)}
#graph .ah-muted{fill:var(--faint)}#graph .ah-path{fill:var(--accent)}#graph .ah-back{fill:var(--violet)}#graph .ah-warn{fill:var(--warn)}
#graph text.elbl{font:11px var(--sans);fill:var(--muted);paint-order:stroke;stroke:var(--panel);stroke-width:4px;stroke-linejoin:round}
#graph text.elbl.taken{fill:var(--violet);font-weight:600}
#graph text.elbl.synth{fill:var(--warn)}
#graph .cnt rect{fill:var(--violet)}#graph .cnt text{fill:#fff;font:600 10.5px var(--sans)}
#graph .cnt.fwdc rect{fill:var(--accent)}#graph .cnt.warnc rect{fill:var(--warn)}
#legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:var(--muted);margin-top:8px}
#legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid var(--line2)}
#marks{margin-top:10px}
table.mt{border-collapse:collapse;width:100%;font-size:12px}
table.mt th{text-align:left;color:var(--muted);font-weight:500;padding:3px 6px;border-bottom:1px solid var(--line)}
table.mt td{padding:3px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.badge{display:inline-block;font-size:11px;padding:0 6px;border-radius:4px;background:var(--panel2);border:1px solid var(--line);white-space:nowrap}
.badge.ok,.badge.done,.badge.pass,.badge.returned,.badge.fixed{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.badge.err,.badge.fail,.badge.failed,.badge.blocker,.badge.timeout,.badge.cancelled{background:var(--err-bg);color:var(--err);border-color:transparent}
.badge.warn,.badge.skip,.badge.inconclusive,.badge.act,.badge.open,.badge.launched,.badge.dropped{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.badge.info,.badge.consider,.badge.dismissed{background:var(--accent-bg);color:var(--accent);border-color:transparent}
#activity svg{display:block;width:100%;height:70px}
#activity .bar{fill:var(--accent);opacity:.7}
#activity .axis{fill:var(--muted);font:10.5px var(--sans)}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin:10px 0}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.stat b{display:block;font-size:16px;font-weight:620}
.stat span{font-size:11px;color:var(--muted)}

/* run panel */
.rp h3{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:14px 0 5px;font-weight:600}
.rp h3:first-child{margin-top:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12.5px}
.kv dt{color:var(--muted)}.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.check{padding:8px 10px;border-radius:6px}
.check.ok{background:var(--ok-bg);color:var(--ok)}
.check.bad{background:var(--err-bg);color:var(--err)}
.check.none{background:var(--panel2);color:var(--muted)}
.check ul{margin:5px 0 0;padding-left:18px;color:var(--text)}
.check .at{font-size:11px;opacity:.85}
.pause{padding:8px 10px;border-radius:6px;background:var(--warn-bg);color:var(--warn)}
.pause .nx{color:var(--text)}
.items{display:flex;flex-direction:column;gap:4px}
.item{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;font-size:12.5px;padding:4px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .x{color:var(--muted);font-size:11.5px}
.item code{overflow-wrap:anywhere}

/* agents */
#agents{padding:6px 8px;overflow:auto;min-height:0}
.atree{list-style:none;margin:0;padding:0}
.atree .atree{padding-left:18px;border-left:1px dashed var(--line2);margin-left:9px}
.anode{display:grid;grid-template-columns:auto 1fr auto;gap:0 8px;align-items:center;padding:4px 6px;border-radius:6px;cursor:pointer}
.anode:hover{background:var(--hover)}
.anode.sel{background:var(--sel);outline:1px solid var(--accent)}
.anode .nm{display:flex;gap:6px;align-items:baseline;min-width:0;overflow:hidden;white-space:nowrap}
.anode .nm b{font-weight:600}
.anode .nm .x{color:var(--muted);font-size:11.5px;overflow:hidden;text-overflow:ellipsis}
.anode .rt{font-size:11.5px;color:var(--muted);white-space:nowrap;display:flex;gap:8px}
.anode .d2{grid-column:2/4;font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.anode .cur{grid-column:2/4;font-family:var(--mono);font-size:11.5px;color:var(--working);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bg{font-size:10px;padding:0 4px;border-radius:3px;border:1px solid var(--line2);color:var(--muted)}

/* timeline */
#tlbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
#afilter{display:none;align-items:center;gap:4px;font-size:11.5px;font-weight:400;background:var(--sel);color:var(--accent);border-radius:999px;padding:0 4px 0 9px}
#afilter.on{display:inline-flex}
#afilter button{border:0;background:transparent;cursor:pointer;padding:0 4px;color:inherit}
#tl-wrap{position:relative;flex:1;min-height:0;display:flex}
#tl-scroll{flex:1;overflow-y:auto;min-height:0;padding:4px 0 24px;outline:none}
#jump{position:absolute;right:16px;bottom:12px;display:none;border:1px solid var(--accent);background:var(--accent);color:#fff;border-radius:999px;padding:4px 12px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.2);font-size:12px}
#jump.on{display:block}
.turn{border-bottom:1px solid var(--line);padding:2px 0 6px}
.ev{display:grid;grid-template-columns:62px 1fr;gap:0 8px;padding:2px 12px;align-items:baseline;min-width:0}
.ev>.t{font-family:var(--mono);font-size:11px;color:var(--faint);white-space:nowrap}
.ev .who{float:left;margin-right:7px;font-size:11px;line-height:19px;color:var(--violet);background:var(--violet-bg);border-radius:4px;padding:0 5px;cursor:pointer;white-space:nowrap;max-width:170px;overflow:hidden;text-overflow:ellipsis}
.ev>.bd{min-width:0;display:flow-root}
.ev.c-prompt{margin:6px 8px 4px;padding:8px 10px;border-radius:7px;background:var(--accent-bg);border-left:3px solid var(--accent)}
.ev.c-prompt .lab{font-size:11px;font-weight:650;color:var(--accent);text-transform:uppercase;letter-spacing:.04em;margin-right:6px}
.ev.c-prompt .txt{font-size:13.5px;color:var(--text);margin-top:2px}
.ev.c-message .txt{color:var(--text)}
.txt{white-space:pre-wrap;overflow-wrap:anywhere}
.txt.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.more{border:0;background:none;color:var(--accent);cursor:pointer;padding:0;font-size:11.5px}
.ev.c-tool .tn{font-weight:600;font-size:12px;margin-right:6px}
.ev.c-tool .sm{font-family:var(--mono);font-size:12px;overflow-wrap:anywhere}
.ev .st{font-size:11px;margin-left:6px;white-space:nowrap}
.ev .st.run{color:var(--working)}
.ev .st.run::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--working);margin-right:4px;animation:pulse 1s infinite}
.ev .st.ok{color:var(--ok)}.ev .st.bad{color:var(--err);font-weight:600}
.ev .out{font-family:var(--mono);font-size:11.5px;color:var(--muted);margin-top:1px}
.ev.is-err .out{color:var(--err)}
.ev.c-agent .bd{color:var(--violet)}
.ev.c-agent .alink{cursor:pointer;text-decoration:underline dotted}
.ev.c-meta .bd,.ev.c-usage .bd{color:var(--faint);font-size:11.5px}
.ev.c-notice .bd{font-size:12px}
.ev.lv-warn .bd{color:var(--warn)}.ev.lv-error .bd{color:var(--err);font-weight:550}.ev.lv-info .bd{color:var(--muted)}
#tl-list.f-prompts .ev:not(.c-prompt){display:none}
#tl-list.f-messages .ev:not(.c-prompt):not(.c-message){display:none}
#tl-list.f-tools .ev:not(.c-prompt):not(.c-tool){display:none}
#tl-list.f-agents .ev:not(.c-prompt):not(.c-agent){display:none}
#tl-list.f-errors .ev:not(.c-prompt):not(.is-err){display:none}
#tl-list.f-errors .ev.c-prompt{opacity:.55}
.ev.flash{animation:flash 1.2s ease-out}
@keyframes flash{from{background:var(--sel)}}

@media (max-width:1100px){
  #grid{grid-template-columns:1fr;overflow:auto}
  .col{min-height:auto}
  #p-graph,#p-run{flex:none;max-height:none}
  #p-tl{min-height:520px}
}
@media (max-width:760px){
  #app{grid-template-columns:1fr;grid-template-rows:auto 38vh 1fr}
  #top{grid-column:1}
  #side{border-right:0;border-bottom:1px solid var(--line)}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<style id="workspace-style">
:root {
  color-scheme: light;
  --bg:#f7f7f4; --panel:#fff; --panel2:#f1f2ef; --line:#e4e6e1; --line2:#d0d5ce;
  --text:#202722; --muted:#69716c; --faint:#7a837c; --accent:#23674d; --accent-bg:#e7f0e9;
  --ok:#277356; --ok-bg:#edf5ef; --warn:#986019; --warn-bg:#fbf2e2; --err:#b4473b; --err-bg:#fbeeea;
  --violet:#76608c; --violet-bg:#f0ebf5; --sel:#e7f0e9; --hover:#eef1ec; --code:#f1f2ef;
  --working:var(--accent); --stalled:var(--warn); --waiting:#7a837c; --idle:#929a94;
  --sans:Inter,"Segoe UI",system-ui,-apple-system,sans-serif;
  --shadow:none;
}
:root[data-theme="dark"] {
  color-scheme:dark;
  --bg:#151819; --panel:#1b1f20; --panel2:#222728; --line:#2b3232; --line2:#414b4a;
  --text:#e9efeb; --muted:#a1aca6; --faint:#8a9790; --accent:#85d5b3; --accent-bg:#223a31;
  --ok:#7fc9a4; --ok-bg:#203329; --warn:#dfb274; --warn-bg:#382f23; --err:#ee9d91; --err-bg:#3c2926;

/* ---------- routes ---------- */

/* ---------- detail fetch & resync ---------- */

    .then(function (r) {

/* ---------- live agent derivation (server `agents` messages overwrite) ---------- */
function ensureAgent(d, id, ts) {

var es = null, backoff = 1000, retryTimer = null, retryAt = 0, lastMsg = 0, connState = 'connecting', everOpen = false;

}
function handler(fn) {

  es = src;
  setConn(everOpen ? 'reconnecting' : 'connecting', everOpen ? 'reconnecting' : 'connecting');
  src.onopen = function () {
    if (es !== src) return;
    everOpen = true;
    backoff = 1000;
    lastMsg = Date.now();
    setConn('live', 'live');
    if (S.d) loadDetail();
  };
  src.onerror = function () {
    if (es !== src) return;
    src.onopen = src.onerror = null;
    src.close();
    es = null;
    scheduleReconnect();
  };
  src.addEventListener('sessions', handler(onSessions));
  src.addEventListener('event', handler(function (d) {
    if (!isObj(d) || !S.d || d.session !== S.d.key || !isObj(d.event)) return;

  src.addEventListener('run', handler(onRun));
  src.addEventListener('agents', handler(onAgents));
  src.addEventListener('ping', handler(function (d) {

    .then(function (j) { if (j) onSessions(j); })
    .catch(function () {})
    .then(function () { fetchingSessions = false; });

  W.replayAt=new Date(Replay.points[Replay.index].ms).toISOString();
  Replay.model=snapshotSession(Replay.index);W.storyKey=null;
  // A request selected later in history must not hide earlier replay activity.
  if(W.request&&W.request!=='all'&&!Replay.model.eventLog.some(function(e) { return String(e.seq)===W.request&&e.kind==='prompt'; }))W.request='all';
  rebuildTimeline(Replay.model);renderReplayViews();
}
function followReplayItem(container,item) {
  var bounds=container.getBoundingClientRect(),rect=item.getBoundingClientRect();
  if(rect.top<bounds.top+20||rect.bottom>bounds.bottom-20)container.scrollTop+=rect.top-bounds.top-24;
}
function highlightReplayPoint() {
  $$('.replay-current').forEach(function(node) { node.classList.remove('replay-current'); });
  if(!Replay.model)return;
  var point=Replay.points[Replay.index],e=point.record,request=requests().slice(-1)[0],id=null,story=null,row=null;
  if(point.kind==='event'){
    request=requests().find(function(r) { return r.events.some(function(item) { return item.seq===e.seq; }); })||request;
    var agent=e.agent_id||e.agent||'main';
    if(request){id=e.kind==='prompt'?'request:'+request.id:agent!=='main'?'agent:'+agent:e.kind==='message'?'result:'+request.id:'actions:'+request.id;
      story=$$('.story-request').find(function(node) { return node.dataset.request===request.id; });
      if(story&&agent!=='main')story=$$('.story-agent',story).find(function(node) { return node.dataset.agent===agent; })||story;
    }
    if(W.mode==='execution'&&W.graphData){var exact=W.graphData.nodes.find(function(n){return n.event&&n.event.seq===e.seq;});if(exact)id=exact.id;}
    row=$$('.ev[data-seq]',TL.list).find(function(node) { return Number(node.dataset.seq)===e.seq; });
    if(!row&&e.kind==='tool_end')row=$$('.ev[data-tool-id]',TL.list).find(function(node) { return node.dataset.toolId===String(e.id); });
  } else if(point.kind==='mark'&&W.mode==='recorded')id=point.phase;
  var node=id&&$$('#graph .node').find(function(n) { return (n.dataset.traceId||n.dataset.id)===id; });
  [node,story,row].filter(Boolean).forEach(function(n) { n.classList.add('replay-current'); });
  if(!Replay.follow)return;
  requestAnimationFrame(function(){
    if(W.tab==='workflow'&&node)focusGraph(id);
    if(W.tab==='story'&&story)followReplayItem($('#p-story'),story);
    if(W.tab==='activity'&&row)followReplayItem(TL.box,row);
  });
}
function renderReplayControls() {
  var d=S.d,bar=$('#phase-replay'),points=replayHistory();
  bar.hidden=!d||!d.loaded||!points.length||W.tab==='workflow'&&W.mode==='blueprint';
  if(!d||!points.length)return;
  var replay=!!Replay.model,index=replay?Replay.index:points.length-1,point=points[index],slider=$('#phase-position');
  bar.dataset.mode=replay?'replay':'live';bar.dataset.record=point?point.key:'';
  slider.max=points.length-1;slider.value=index;slider.disabled=points.length<2;
  slider.setAttribute('aria-valuetext',(index+1)+' of '+points.length+' · '+clock(point.ms)+' · '+replayLabel(point));
  $('#phase-play').disabled=points.length<2;$('#phase-play').textContent='';$('#phase-play').appendChild(uiIcon(W.playing?'pause':'play'));
  $('#phase-play').setAttribute('aria-label',W.playing?'Pause session replay':'Play session history');
  $('#replay-prev').disabled=index<=0;$('#replay-next').disabled=!replay||index>=points.length-1;
  var limited=(Replay.archive?Replay.archive.eventLog:d.eventLog)[0];
  $('#replay-caption').textContent=limited&&limited.seq>1?'Recent history':'Session history';
  $('#replay-caption').title='Replays the available event window and timestamped workflow records. Earlier or unrecorded events are not reconstructed. Playback advances by record; idle gaps are skipped.';
  $('#phase-time').textContent=(replay?clock(point.ms)+' · replay':'Latest activity')+' · '+(index+1)+' / '+points.length;
  $('#replay-event').textContent=replayLabel(point);$('#replay-event').title=replayLabel(point);
  $('#phase-latest').hidden=!replay;
  var incoming=replay?Math.max(0,d.maxSeq-Replay.archive.maxSeq):0;
  $('#phase-latest').textContent=incoming?'Return to live · '+num(incoming)+' new':'Return to live';
  $('#replay-follow').checked=Replay.follow;
}
function playReplay() {
  if(W.playing){stopPhaseReplay();renderReplayControls();return;}
  if(!Replay.model||Replay.index>=Replay.points.length-1)showPhasePoint(0);
  if(!Replay.points.length)return;
  W.playing=true;
  W.replayTimer=setInterval(function(){
    if(!S.d||!Replay.model){stopPhaseReplay();return;}
    if(Replay.index>=Replay.points.length-1){stopPhaseReplay();renderReplayControls();return;}
    showPhasePoint(Replay.index+1);
    if(Replay.index>=Replay.points.length-1){stopPhaseReplay();renderReplayControls();}
  },800/Replay.speed);
  renderReplayControls();
}
$('#phase-position').oninput=function(){stopPhaseReplay();showPhasePoint(Number(this.value));};
$('#phase-play').onclick=playReplay;
$('#phase-latest').onclick=returnToLive;
$('#replay-prev').onclick=function(){stopPhaseReplay();showPhasePoint((Replay.model?Replay.index:replayHistory().length-1)-1);};
$('#replay-next').onclick=function(){stopPhaseReplay();showPhasePoint(Replay.index+1);};
$('#replay-speed').onchange=function(){Replay.speed=Number(this.value);if(W.playing){stopPhaseReplay();playReplay();}};
$('#replay-follow').onchange=function(){Replay.follow=this.checked;if(Replay.follow)highlightReplayPoint();};


/* ---------- boot ---------- */
renderFilters();
renderTlFilters();
loadRoutes();
fetchSessionsOnce();
var initial = hashKey();
if (initial) select(initial, true); else connect();
})();
</script>
